<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Juspay Dynamic Loop Emblem (Without Wordmark) -->
  <g id="juspay-logo">
    <!-- Left Half: Light / Electric Sky Blue (#009BFF) -->
    <!-- Extends as a semi-circle on the left with the bottom hook rising to y=72 and the inner aperture sweeping up to the top peak at (50, 15) -->
    <path 
      d="M 50 2 
         A 48 48 0 0 0 50 98 
         L 50 72 
         C 32 72 26 58 26 50 
         C 26 36 34 24 50 15 
         Z" 
      fill="#009BFF" 
    />

    <!-- Right Half: Royal / Sapphire Blue (#007CEB) -->
    <!-- Extends as a semi-circle on the right with the top hook descending to y=28 and the inner aperture sweeping down to the bottom peak at (50, 85) -->
    <path 
      d="M 50 2 
         A 48 48 0 0 1 50 98 
         L 50 85 
         C 66 76 74 64 74 50 
         C 74 42 68 28 50 28 
         Z" 
      fill="#007CEB" 
    />
  </g>
</svg>
